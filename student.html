<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Labs · Science Lab 1971</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="student.html"><span class="logo">🧪</span><b>Science Lab 1971</b></a>
    <div class="row gap">
      <span class="who" id="who"></span><span class="pill student" id="cls"></span>
      <button class="btn sm orange" onclick="S1971.logout()">Log out</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:18px">
    <h1 id="hello">Welcome! 👋</h1>
    <p class="muted">Pick a lab. Each level has <b>7 tasks</b>. Score <b id="pm"></b> or more to pass, unlock the next level and get a 🎓 certificate.</p>
  </div>

  <div class="subj-tabs" id="subj-tabs"></div>
  <div id="labs"></div>

  <div class="card" style="margin-top:18px">
    <div class="row between gap"><h2>🎓 My certificates</h2>
      <div class="row gap"><select class="inline" id="c-subj"></select><select class="inline" id="c-level"><option value="">All levels</option><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="all">🏆 Lab completed</option></select></div></div>
    <div id="certs" class="cert-list"></div>
  </div>

  <div class="card" style="margin-top:18px">
    <div class="row between gap"><h2>🏆 My results</h2>
      <div class="row gap"><select class="inline" id="m-subj"></select><select class="inline" id="m-level"><option value="">All levels</option><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option></select><select class="inline" id="m-pass"><option value="">Pass &amp; fail</option><option value="pass">✅ Passed</option><option value="fail">❌ Not passed</option></select></div></div>
    <div class="table-wrap"><table id="my"></table></div>
  </div>

  <footer>Built by Mr. Moayed Alkhliefat · Science Teacher · ATS-AQB</footer>
</div>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script src="labs/catalog.js"></script>
<script>
const { rpc, esc, toast, fmtDate } = S1971;
const PASS = S1971_CONFIG.PASS_MARK;
const pctOf = r => 100 * r.score / r.max_score;
const passed = r => pctOf(r) >= PASS - 1e-9;

(async function init() {
  const ME = await S1971.requireRole(["student"]);
  if (!ME) return;
  document.getElementById("who").textContent = ME.name;
  document.getElementById("cls").textContent = [ME.grade && "Grade " + ME.grade, ME.section].filter(Boolean).join(" · ") || "student";
  document.getElementById("hello").textContent = `Welcome, ${ME.first_name}! 👋`;
  document.getElementById("pm").textContent = PASS + "%";

  let mine = [], open = [];
  try { [mine, open] = await Promise.all([rpc("student_my_results", { p_token: ME.token }), rpc("student_assigned_labs", { p_token: ME.token })]); } catch (e) { toast(e.message, "bad"); }
  const best = {};
  mine.forEach(r => { best[r.lab_id] = Math.max(best[r.lab_id] || 0, pctOf(r)); });
  const isPass = id => (best[id] || 0) >= PASS - 1e-9;

  // ----- labs grouped by subject -----
  const labs = window.S1971_LABS.filter(l => open.includes(l.id));
  const subjects = window.S1971_SUBJECTS.filter(s => labs.some(l => l.subject === s.key));
  const box = document.getElementById("labs"), tabs = document.getElementById("subj-tabs");
  if (!labs.length) { box.innerHTML = `<div class="card empty">Your teacher has not opened any labs for your class yet. Check back soon! 🚀</div>`; }
  let cur = "all";
  const labCard = l => `
    <div class="lab" style="--lab:${l.color}"><div class="band"></div>
      <div class="icon">${l.icon}</div><h3>${esc(l.title)}</h3><p>${esc(l.description)}</p>
      <div class="levels">${l.levels.map((v, i) => {
        const prev = i === 0 ? null : l.levels[i - 1];
        const unlocked = !prev || isPass(prev.id);
        const b = best[v.id];
        const badge = b != null ? (isPass(v.id) ? `⭐ ${Math.floor(b)}%` : `${Math.floor(b)}%`) : unlocked ? "▶ Start" : "🔒";
        return unlocked ? `<a class="lvl" href="${l.path}?level=${v.n}">${esc(v.name)} <span class="best">${badge}</span></a>`
                        : `<span class="lvl locked" title="Score ${PASS}% in ${esc(prev.name)} to unlock">${esc(v.name)} <span class="best">🔒</span></span>`;
      }).join("")}</div>
    </div>`;
  const drawLabs = () => {
    tabs.innerHTML = subjects.length > 1 ? [`<button class="tab ${cur === "all" ? "active" : ""}" data-s="all">📚 All</button>`]
      .concat(subjects.map(s => `<button class="tab ${cur === s.key ? "active" : ""}" data-s="${s.key}">${s.icon} ${s.key}</button>`)).join("") : "";
    const shown = subjects.filter(s => cur === "all" || cur === s.key);
    const block = s => `
      <h2 class="subj-head" style="--sc:${s.color}">${s.icon} ${s.key}</h2>
      <div class="labs">${labs.filter(l => l.subject === s.key).map(labCard).join("")}</div>`;
    box.innerHTML = shown.length > 1
      ? `<div class="subj-cols" style="--n:${shown.length}">${shown.map(s => `<div class="subj-col">${block(s)}</div>`).join("")}</div>`
      : shown.map(block).join("");
    tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => { cur = b.dataset.s; drawLabs(); });
  };
  if (labs.length) drawLabs();

  // ----- certificates -----
  const certs = [];
  window.S1971_LABS.forEach(l => {
    l.levels.forEach((v, i) => { if (isPass(v.id)) certs.push({ title: `${l.title} — ${v.name}`, icon: l.icon, url: `certificate.html?lab=${l.id}&level=${v.n}`, score: Math.floor(best[v.id]), big: false, subject: l.subject, level: String(i + 1) }); });
    if (l.levels.every(v => isPass(v.id))) certs.push({ title: `${l.title} — Lab completed (all levels)`, icon: "🏆", url: `certificate.html?lab=${l.id}&level=all`, big: true, subject: l.subject, level: "all" });
  });
  // subject lists only show subjects that have something to show
  const subjOpts = (id, keys) => { const el = document.getElementById(id); el.innerHTML = `<option value="">All subjects</option>` + window.S1971_SUBJECTS.filter(sb => keys.includes(sb.key)).map(sb => `<option value="${sb.key}">${sb.icon} ${sb.key}</option>`).join(""); };
  subjOpts("c-subj", certs.map(c => c.subject));
  const drawCerts = () => {
    const sj = document.getElementById("c-subj").value, lv = document.getElementById("c-level").value;
    const list = certs.filter(c => (!sj || c.subject === sj) && (!lv || c.level === lv));
    document.getElementById("certs").innerHTML = list.length ? list.map(c => `
    <a class="cert-item ${c.big ? "big" : ""}" href="${c.url}"><span class="ci">${c.icon}</span><span><b>${esc(c.title)}</b>${c.score != null ? `<br><small>Score ${c.score}%</small>` : `<br><small>Completion certificate</small>`}</span><span class="open">Open 🎓</span></a>`).join("")
    : certs.length ? `<p class="muted">No certificates match these filters.</p>` : `<p class="muted">Pass a level (${PASS}% or more) to earn your first certificate! 🎯</p>`;
  };
  ["c-subj", "c-level"].forEach(id => document.getElementById(id).addEventListener("input", drawCerts));
  drawCerts();

  // ----- results -----
  const titles = {};
  window.S1971_LABS.forEach(l => l.levels.forEach(v => titles[v.id] = `${l.title} — ${v.name}`));
  const info = {};
  window.S1971_LABS.forEach(l => l.levels.forEach((v, i) => info[v.id] = { subject: l.subject, level: String(i + 1) }));
  subjOpts("m-subj", mine.map(r => (info[r.lab_id] || {}).subject));
  const t = document.getElementById("my");
  const drawMine = () => {
    const sj = document.getElementById("m-subj").value, lv = document.getElementById("m-level").value, ps = document.getElementById("m-pass").value;
    const list = mine.filter(r => { const i = info[r.lab_id] || { level: String((r.details && r.details.level) || "") }; return (!sj || i.subject === sj) && (!lv || i.level === lv) && (!ps || (ps === "pass") === passed(r)); });
    t.innerHTML = !mine.length ? `<tr><td class="empty">No results yet — start your first lab! 🧪</td></tr>` : !list.length ? `<tr><td class="empty">No results match these filters.</td></tr>` : `<tr><th>Lab</th><th>Score</th><th>Time</th><th>Date</th></tr>` + list.map(r => {
    const p = pctOf(r), ts = r.time_s;
    return `<tr><td>${esc(titles[r.lab_id] || r.lab_title || r.lab_id)}</td><td><span class="score ${p >= PASS - 1e-9 ? "hi" : p >= 50 ? "mid" : "lo"}">${Math.floor(p)}%</span></td><td>${ts ? `${String(Math.floor(ts / 60)).padStart(2, "0")}:${String(ts % 60).padStart(2, "0")}` : "—"}</td><td>${fmtDate(r.completed_at)}</td></tr>`;
  }).join("");
  };
  ["m-subj", "m-level", "m-pass"].forEach(id => document.getElementById(id).addEventListener("input", drawMine));
  drawMine();
})();
</script>
</body>
</html>
