"use strict";
const E = LabEngine, esc = E.esc;

/* ===================== ORGANS & PICTURE ===================== */

};
const ALL = Object.keys(O);
const MARK = ALL.filter(k => !O[k].noMark);
const L1 = ["mouth", "esophagus", "stomach", "small", "large", "rectum", "anus"];
const HELPERS = ["salivary", "liver", "gallbladder", "pancreas"];
const TRACT = ["mouth", "esophagus", "stomach", "small", "large", "rectum", "anus"];
const FACT = {
  mouth: "Teeth do mechanical digestion; saliva contains amylase, which starts breaking starch into sugar.",
  salivary: "They make about 1–1.5 litres of saliva every day. Saliva contains the enzyme amylase.",
  esophagus: "About 25 cm long. No digestion happens here — it only moves food by peristalsis.",
  liver: "The largest internal organ. Bile has no enzymes — it emulsifies fat into tiny droplets.",

const LEVEL_ORGANS = { 1: L1, 2: ALL, 3: ALL };
const DOTS = { 1: L1, 2: MARK, 3: MARK };

const IMG = { src: "digestive-system.jpg", w: 652, h: 1536, pad: 150 };
const FOOD_PATH = "M322,96 L318,170 C322,300 326,420 334,560 C342,620 380,650 420,690 C470,730 490,790 440,840 C380,880 300,840 245,815 C215,830 212,870 232,930 C200,1000 250,1040 330,1050 C380,1070 260,1100 190,1120 C230,1150 330,1140 370,1165 C330,1200 230,1190 200,1225 C260,1250 360,1240 380,1255 C300,1275 200,1260 135,1240 C100,1210 92,1150 94,1060 C95,1000 100,950 140,925 C220,960 330,985 420,950 C470,930 515,925 530,960 C536,1050 532,1180 522,1270 C480,1310 400,1300 340,1295 C300,1305 296,1340 305,1400 L305,1480";
const COL = { ok: "#16c172", seen: "#16c172", no: "#ff4d4d", cur: "#ff9f1c", sel: "#7b4dff", miss: "#16c172" };

// opts: { markers:[{organ,num,text}], dots:[{organ,text}], states:{organ:state}, clickable, animate }
function diagram(opts) {
  opts = opts || {};
  const X = IMG.pad, W = IMG.w + 2 * IMG.pad, H = IMG.h, states = opts.states || {};
  let m = "";
  (opts.markers || []).forEach(k => {
    const o = O[k.organ]; if (o.noMark) return;
    const ax = o.a[0] + X, ay = o.a[1], mx = o.side === "L" ? 62 : W - 62, my = o.y;
    const fill = COL[states[k.organ]] || "#7b4dff";
    const label = k.text != null ? k.text : k.num;
    m += `<g class="marker ${opts.clickable ? "hot" : ""}" data-organ="${k.organ}">
      <line x1="${ax}" y1="${ay}" x2="${mx}" y2="${my}" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".85"/>
      <line x1="${ax}" y1="${ay}" x2="${mx}" y2="${my}" stroke="#1d1b4b" stroke-width="4" stroke-linecap="round"/>
      <circle cx="${ax}" cy="${ay}" r="10" fill="#1d1b4b" stroke="#fff" stroke-width="4"/>
      <circle cx="${mx}" cy="${my}" r="38" fill="${fill}" stroke="#fff" stroke-width="7"/>
      <text x="${mx}" y="${my + 15}" text-anchor="middle" font-family="Baloo 2, Nunito, sans-serif" font-weight="800" font-size="44" fill="#fff">${label}</text>
      ${opts.clickable ? `<circle cx="${mx}" cy="${my}" r="52" fill="transparent"/><circle cx="${ax}" cy="${ay}" r="45" fill="transparent"/>` : ""}</g>`;
  });
  (opts.dots || []).forEach(k => {
    const o = O[k.organ]; if (o.noMark) return;
    const x = o.a[0] + X, y = o.a[1], st = states[k.organ];
    const fill = st ? COL[st] : "rgba(255,255,255,.9)", stroke = st ? "#fff" : "#7b4dff", tc = st ? "#fff" : "#7b4dff";
    m += `<g class="marker ${opts.clickable ? "hot" : ""}" data-organ="${k.organ}">
      <circle cx="${x}" cy="${y}" r="36" fill="${fill}" stroke="${stroke}" stroke-width="7" ${st === "miss" ? 'stroke-dasharray="10 8" fill-opacity=".55"' : ""}/>
      <text x="${x}" y="${y + 15}" text-anchor="middle" font-family="Baloo 2, Nunito, sans-serif" font-weight="800" font-size="42" fill="${tc}">${k.text != null ? k.text : ""}</text>
      ${opts.clickable ? `<circle cx="${x}" cy="${y}" r="58" fill="transparent"/>` : ""}</g>`;
  });
  const img = new URL(IMG.src, location.href).href;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Picture of the human digestive system">
    <rect width="${W}" height="${H}" fill="#fff"/>
    <image href="${img}" x="${X}" y="0" width="${IMG.w}" height="${IMG.h}"/>
    ${opts.animate ? `<g transform="translate(${X},0)"><circle r="20" fill="#ffd23f" stroke="#8a5a00" stroke-width="6"><animateMotion dur="12s" fill="freeze" path="${FOOD_PATH}"/></circle></g>` : ""}
    ${m}</svg>`;
}
const names = list => list.map(k => O[k].name).join(", ");
const lvlDots = () => DOTS[S1971Lab.level].map(k => ({ organ: k }));

/* ===================== TEMPLATES (every task uses the picture) ===================== */
const T = {
  label: (diff, from, n, uses = 1) => ({ type: "label", diff, uses, build() {
    const keys = E.pick(from, n).sort((a, b) => O[a].a[1] - O[b].a[1]);
    return { prompt: "Put each organ name on the correct number in the picture.", summary: `Label the picture (${keys.length} organs)`,
      explain: "Follow the path of food from the mouth down to the anus.",
      slots: keys.map((k, i) => ({ organ: k, num: i + 1, left: `<span class="num">${i + 1}</span>`, answer: O[k].name })) };
  }}),
  jobs: (diff, from, n, uses = 1) => ({ type: "jobs", diff, uses, build() {
    const keys = E.pick(from, n).sort((a, b) => O[a].a[1] - O[b].a[1]);
    return { prompt: "Put each JOB on the correct organ number in the picture.", summary: `Jobs on the picture (${keys.length} organs)`,
      explain: "Each organ has a special job — together they turn food into nutrients your body can use.",
      slots: keys.map((k, i) => ({ organ: k, num: i + 1, left: `<span class="num">${i + 1}</span>`, answer: O[k].fn })) };
  }}),
  jobsCustom: (diff, pairs, prompt, explain, summary) => ({ type: "jobs", diff, uses: 1, build() {
    const ps = pairs.slice().sort((a, b) => O[a[0]].a[1] - O[b[0]].a[1]);
    return { prompt, explain, summary, slots: ps.map((p, i) => ({ organ: p[0], num: i + 1, left: `<span class="num">${i + 1}</span>`, answer: p[1] })) };
  }}),
  pick: (diff, prompt, answer, explain) => ({ type: "pick", diff, uses: 1, build() {
    return { prompt: "👆 " + prompt, answer: [answer], many: false, explain, summary: "Click: " + prompt };
  }}),
  pickMany: (diff, prompt, answers, explain) => ({ type: "pickMany", diff, uses: 1, build() {
    return { prompt: "👆 " + prompt, answer: answers, many: true, explain, summary: "Click all: " + prompt };
  }}),
  path: (diff, prompt, order, explain, summary) => ({ type: "path", diff, uses: 1, build() {
    return { prompt: "👆 " + prompt, order, explain, summary };
  }}),
  scenario: (diff, story, partA, organ, partB, correct, wrong, explain) => ({ type: "scenario", diff, uses: 1, build() {
    return { story, partA, organ, partB, options: E.mkOptions(correct, wrong), explain, summary: "Scenario: " + story.slice(0, 70) + (story.length > 70 ? "…" : "") };
  }})
};

/* ===================== LEVEL CONTENT ===================== */

    T.label(3, L1, 7, 1),
    T.jobs(3, L1, 7, 1),
    T.pickMany(3, "Click the TWO organs that hold material for a while (food or feces).", ["stomach", "rectum"], "The stomach holds food for a few hours; the rectum stores feces."),
    T.scenario(3, "Omar has a stomach problem: his stomach muscles are very weak.", "Click the organ that is affected.", "stomach",

  ]},

    T.pickMany(2, "Click ALL the organs that make or store a juice that is used in the small intestine.", ["liver", "gallbladder", "pancreas"], "Bile (made by the liver, stored in the gallbladder) and pancreatic juice both flow into the small intestine."),

    T.scenario(3, "Salivary amylase stops working after the food is swallowed.", "Click where amylase stops working.", "stomach",

/* ===================== RENDERERS ===================== */
function chipWithPicture(q) {
  E.chipTask(q, {
    dropText: q.type === "label" ? "drop the name here" : "drop it here",
    side: states => diagram({ markers: q.slots.map(s => ({ organ: s.organ, num: s.num })),
      states: states ? Object.fromEntries(q.slots.map((s, i) => [s.organ, states[i] ? "ok" : "no"])) : null })
  });
}

function dotText(st, selected) {
  return st === "ok" ? "✓" : st === "no" ? "✗" : st === "miss" ? "!" : selected ? "✓" : "";
}

function renderPick(q) {
  const sel = new Set(); let checked = false;
  const draw = () => {
    const states = {};
    sel.forEach(k => states[k] = "sel");
    if (checked) { sel.forEach(k => states[k] = q.answer.includes(k) ? "ok" : "no"); q.answer.forEach(k => { if (!sel.has(k)) states[k] = "miss"; }); }
    const ready = q.many ? sel.size > 0 : sel.size === 1;
    E.stage.innerHTML = E.header() +
      `<div class="split"><div class="diagram">${diagram({ dots: lvlDots().map(d => ({ organ: d.organ, text: dotText(states[d.organ], sel.has(d.organ)) })), states, clickable: !checked })}</div>
       <div><div class="step-box">${q.many ? "Tap EVERY correct circle on the picture (tap again to undo), then press Check." : "Tap ONE circle on the picture, then press Check."}
         <p class="hint" style="margin:6px 0 0">Selected: <b>${sel.size ? (checked ? esc(names([...sel])) : sel.size + " circle" + (sel.size > 1 ? "s" : "")) : "nothing yet"}</b></p></div>
         ${checked ? `<div class="notice">✅ Answer: <b>${esc(names(q.answer))}</b></div>` : E.actions(ready)}</div></div>`;
    if (checked) return;
    E.stage.querySelectorAll(".marker.hot").forEach(g => g.onclick = () => {
      const k = g.dataset.organ;
      if (q.many) { sel.has(k) ? sel.delete(k) : sel.add(k); } else { sel.clear(); sel.add(k); }
      draw();
    });
    const b = document.getElementById("check");
    if (b) b.onclick = () => {
      checked = true;
      const right = [...sel].filter(k => q.answer.includes(k)).length, wrong = sel.size - right;
      const pts = q.many ? Math.max(0, (right - wrong) / q.answer.length) : (q.answer.includes([...sel][0]) ? 1 : 0);
      draw(); E.grade(pts);
    };
  };
  draw();
}

function renderPath(q) {
  const seq = []; let checked = false;
  const draw = () => {
    const states = {}, text = {};
    seq.forEach((k, i) => { states[k] = checked ? (q.order[i] === k ? "ok" : "no") : "sel"; text[k] = i + 1; });
    const ready = seq.length === q.order.length;
    E.stage.innerHTML = E.header() +
      `<div class="split"><div class="diagram">${diagram({ dots: lvlDots().map(d => ({ organ: d.organ, text: text[d.organ] != null ? text[d.organ] : "" })), states, clickable: !checked })}</div>
       <div><div class="step-box">Tap the circles in order: <b>${seq.length} / ${q.order.length}</b> chosen. Tap a numbered circle to remove it.
         ${checked ? `<ol style="margin:8px 0 0">${seq.map((k, i) => `<li>${esc(O[k].name)} ${q.order[i] === k ? "✅" : "❌"}</li>`).join("")}</ol>` : ""}</div>
         ${checked ? `<div class="notice"><b>Correct order:</b><ol>${q.order.map(k => `<li>${esc(O[k].name)}</li>`).join("")}</ol></div>` : E.actions(ready)}</div></div>`;
    if (checked) return;
    E.stage.querySelectorAll(".marker.hot").forEach(g => g.onclick = () => {
      const k = g.dataset.organ, i = seq.indexOf(k);
      if (i >= 0) seq.splice(i, 1); else if (seq.length < q.order.length) seq.push(k);
      draw();
    });
    const b = document.getElementById("check");
    if (b) b.onclick = () => { checked = true; draw(); E.grade(seq.filter((k, i) => q.order[i] === k).length / q.order.length); };
  };
  draw();
}

function renderScenario(q) {
  let organ = null, aDone = false, aOk = false, sel = null, bDone = false;
  const draw = () => {
    const states = {};
    if (organ) states[organ] = aDone ? (aOk ? "ok" : "no") : "sel";
    if (aDone && !aOk) states[q.organ] = "miss";
    E.stage.innerHTML = E.header() + `<div class="story">📋 ${esc(q.story)}</div>
      <div class="split"><div class="diagram">${diagram({ dots: lvlDots().map(d => ({ organ: d.organ, text: dotText(states[d.organ], organ === d.organ) })), states, clickable: !aDone })}</div>
      <div>
        <div class="step-box"><span class="part ${aDone ? "done" : ""}">Part A</span><b>${esc(q.partA)}</b>
          <p class="hint" style="margin:6px 0 0">${organ ? (aDone ? "You chose: <b>" + esc(O[organ].name) + "</b>" : "Circle selected ✓ — press Check Part A.") : "Tap a circle on the picture."}</p>
          ${aDone ? `<p style="margin:6px 0 0;font-weight:800">${aOk ? "✅ Correct!" : "❌ The answer is: " + esc(O[q.organ].name)}</p>` : ""}</div>
        ${!aDone ? E.actions(!!organ, "Check Part A ✔") : `
        <div class="step-box"><span class="part ${bDone ? "done" : ""}">Part B</span><b>${esc(q.partB)}</b></div>
        ${E.optionsHtml(q.options, sel, bDone)}
        ${bDone ? "" : E.actions(sel != null, "Check Part B ✔")}`}
      </div></div>`;
    if (!aDone) {
      E.stage.querySelectorAll(".marker.hot").forEach(g => g.onclick = () => { organ = g.dataset.organ; draw(); });
      const b = document.getElementById("check"); if (b) b.onclick = () => { aDone = true; aOk = organ === q.organ; draw(); };
      return;
    }
    if (bDone) return;
    E.stage.querySelectorAll(".opt").forEach(o => o.onclick = () => { sel = +o.dataset.i; draw(); });
    const b = document.getElementById("check");
    if (b) b.onclick = () => { bDone = true; draw(); E.grade((aOk ? 0.5 : 0) + (q.options[sel].correct ? 0.5 : 0)); };
  };
  draw();
}

/* ===================== EXPLORE (Step 1) ===================== */
function explore(lvl, done) {
  const organs = LEVEL_ORGANS[lvl], seen = new Set(), st = E.stage;
  let cur = null, anim = false;
  const infoHtml = () => {
    if (!cur) return `<div class="explore-info empty-info"><div style="font-size:3rem">👆</div><b>Click a number on the picture</b><p class="hint">Explore every organ to unlock the tasks.</p></div>`;
    const o = O[cur], helper = HELPERS.includes(cur);
    return `<div class="explore-info">
      <div class="row gap"><span class="organ-dot"></span><h2 style="margin:0">${esc(o.name)}</h2></div>
      ${lvl >= 2 ? `<span class="tag ${helper ? "helper" : "tract"}">${helper ? "🧩 Helper organ — food does NOT pass through it" : "🍽️ Food passes through here"}</span>` : ""}
      ${o.noMark ? `<p class="hint" style="margin:6px 0 0">📍 Not shown in the picture: they sit under the tongue, under the jaw and in front of the ears, and send saliva into the mouth.</p>` : ""}
      <p class="fn"><b>Job:</b> ${esc(o.fn)}.</p>
      ${lvl >= 3 || (lvl === 2 && helper) ? `<p class="fact">🔬 ${esc(FACT[cur])}</p>` : ""}
    </div>`;
  };
  const draw = () => {
    const states = {};
    organs.forEach(k => { if (seen.has(k)) states[k] = "seen"; });
    if (cur) states[cur] = "cur";
    const markers = organs.map((k, i) => ({ organ: k, num: i + 1, text: seen.has(k) ? "✓" : "?" }));
    const all = seen.size === organs.length;
    st.innerHTML = `<div class="lab-head"><b>🔍 Step 1: Explore the model</b><b>Explored: ${seen.size} / ${organs.length}</b></div>
      <div class="bar"><i style="width:${100 * seen.size / organs.length}%"></i></div>
      <p class="prompt">Click each <span style="color:#7b4dff">?</span> to learn what that organ does. ${lvl === 1 ? "" : "Watch out for the helper organs!"}</p>
      <div class="split"><div class="diagram">${diagram({ markers, states, clickable: true, animate: anim })}
        <div class="row gap" style="justify-content:center;margin:8px 0 4px"><button class="btn sm orange" id="play">▶ Watch the food's journey</button></div></div>
        <div>${infoHtml()}
          <div class="chips" style="margin-top:12px">${organs.map(k => `<span class="chip ${seen.has(k) ? "sel" : ""}" data-o="${k}">${seen.has(k) ? "✅ " + esc(O[k].name) : O[k].noMark ? "🔍 Hidden organ — tap me!" : "❔ ???"}</span>`).join("")}</div>
          <div class="actions"><span class="hint">${all ? "Great — you explored everything!" : "Explore all organs to continue."}</span>
            <button class="btn green" id="go" ${all ? "" : "disabled"}>Step 2: Start the ${E.TOTAL} tasks 🚀</button></div>
        </div></div>`;
    st.querySelectorAll(".marker.hot").forEach(g => g.onclick = () => { cur = g.dataset.organ; seen.add(cur); anim = false; draw(); });
    st.querySelectorAll(".chip[data-o]").forEach(c => c.onclick = () => { const o = c.dataset.o; if (seen.has(o) || O[o].noMark) { cur = o; seen.add(o); anim = false; draw(); } });
    document.getElementById("play").onclick = () => { anim = true; draw(); anim = false; };
    document.getElementById("go").onclick = done;
  };
  draw();
}

/* ===================== START ===================== */
E.start({
  labId: "digestive", total: 12, emoji: "🍎", levels: LEVELS, explore, typeCycle: 4,
  taskNote: "label, jobs, find the organ, trace the path and problem scenarios — all on the picture",
  confetti: ["🎉", "⭐", "🍎", "🧪", "✨", "🥕"],
  typeInfo: { label: "🏷️ Label the picture", jobs: "🔗 Jobs on the picture", pick: "👆 Find the organ", pickMany: "👆 Find ALL the organs", path: "🚶 Trace the path", scenario: "🧠 Problem scenario" },
  renderers: { label: chipWithPicture, jobs: chipWithPicture, pick: renderPick, pickMany: renderPick, path: renderPath, scenario: renderScenario }
});
</script>
